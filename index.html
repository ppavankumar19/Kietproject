<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Testimonials - AI Karyashala Bootcamp</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151b3d;
            --bg-card: #1a2249;
            --accent-primary: #00d9ff;
            --accent-secondary: #7c3aed;
            --accent-tertiary: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3a5f;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.03;
            background-image: 
                linear-gradient(30deg, var(--accent-primary) 12%, transparent 12.5%, transparent 87%, var(--accent-primary) 87.5%, var(--accent-primary)),
                linear-gradient(150deg, var(--accent-primary) 12%, transparent 12.5%, transparent 87%, var(--accent-primary) 87.5%, var(--accent-primary));
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px;
            animation: patternShift 20s linear infinite;
        }

        @keyframes patternShift {
            0% { transform: translateY(0); }
            100% { transform: translateY(140px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            padding: 4rem 0 2rem;
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .glow-orb-1 {
            background: var(--accent-primary);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
            50% { transform: translateX(-50%) translateY(-20px) scale(1.1); }
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: normal;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 800px;
            margin: 0 auto 1rem;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Control Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: 2px solid var(--accent-primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 217, 255, 0.5);
        }

        .control-btn:active {
            transform: translateY(-1px);
        }

        .shuffle-icon {
            font-size: 1.5rem;
            animation: rotateIcon 2s linear infinite;
            animation-play-state: paused;
        }

        .control-btn:hover .shuffle-icon {
            animation-play-state: running;
        }

        @keyframes rotateIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Testimonials Grid */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Testimonial Card */
        .testimonial-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            animation: cardAppear 0.5s ease-out backwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .testimonial-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(124, 58, 237, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .testimonial-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 
                        0 0 20px rgba(0, 217, 255, 0.1);
        }

        .testimonial-card:hover::before {
            opacity: 1;
        }

        /* Student Header */
        .student-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .student-image {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .testimonial-card:hover .student-image {
            transform: scale(1.1);
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .student-details {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .student-branch {
            display: inline-block;
            background: rgba(0, 217, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--accent-primary);
            margin-top: 0.25rem;
        }

        /* Rating Stars */
        .rating {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .star {
            color: var(--accent-tertiary);
            font-size: 1.2rem;
        }

        .star.empty {
            color: var(--text-muted);
        }

        /* Review Text */
        .review-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            flex: 1;
            position: relative;
            z-index: 1;
            font-style: italic;
        }

        .review-text::before {
            content: '"';
            font-size: 3rem;
            color: var(--accent-primary);
            opacity: 0.2;
            position: absolute;
            top: -1rem;
            left: -0.5rem;
            font-family: 'DM Serif Display', serif;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin: 4rem 0;
            flex-wrap: wrap;
        }

        .pagination-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-number {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-number:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            transform: translateY(-2px);
        }

        .page-number.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        .page-info {
            color: var(--text-secondary);
            font-size: 1rem;
            padding: 0 1rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-secondary);
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            z-index: 100;
            font-weight: 600;
        }

        .back-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .testimonials-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .stats-bar {
                gap: 1.5rem;
            }

            .stat-number {
                font-size: 2rem;
            }

            .back-btn {
                top: 1rem;
                left: 1rem;
                padding: 0.6rem 1.2rem;
            }

            .page-numbers {
                max-width: 100%;
            }

            .control-btn {
                padding: 0.85rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <a href="index.html" class="back-btn">
        <span>←</span>
        <span>Back to Home</span>
    </a>

    <header>
        <div class="glow-orb glow-orb-1"></div>
        <div class="container">
            <h1>Student Testimonials</h1>
            <p class="subtitle">Hear what our bootcamp participants have to say about their experience</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">Total Reviews</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="averageRating">0.0</div>
                    <div class="stat-label">Average Rating</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <button class="control-btn" onclick="showRandomProfiles()">
                <span class="shuffle-icon">🔀</span>
                <span>Show Random 10 Profiles</span>
            </button>
        </div>

        <div id="testimonials-container" class="testimonials-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading testimonials...</p>
            </div>
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination will be inserted here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://llympyfpcssbfnphsucb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxseW1weWZwY3NzYmZucGhzdWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk0NDE5MTUsImV4cCI6MjA1NTAxNzkxNX0.4S6SBjyO-JCMvJM_hAzZZGN8CwU5SkW1rGZvWNuHX_s';
        
        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let studentsData = [];
        let currentPage = 1;
        const studentsPerPage = 10;
        let isRandomMode = false;

        // Load students data from Supabase
        async function loadStudents() {
            try {
                console.log('Loading students from Supabase...');
                
                // Fetch JSON from Supabase Storage
                const { data: jsonData, error } = await supabase.storage
                    .from('data')
                    .download('students_data.json');
                
                if (error) {
                    console.error('Supabase download error:', error);
                    throw error;
                }
                
                // Convert blob to text and parse JSON
                const text = await jsonData.text();
                studentsData = JSON.parse(text);
                
                console.log(`Loaded ${studentsData.length} students`);
                
                // Update image URLs to point to Supabase Storage
                studentsData = studentsData.map(student => ({
                    ...student,
                    image: `${SUPABASE_URL}/storage/v1/object/public/student-images/${student.image.replace('student_images/', '')}`
                }));
                
                // Update stats
                document.getElementById('totalStudents').textContent = studentsData.length;
                const avgRating = (studentsData.reduce((sum, s) => sum + s.rating, 0) / studentsData.length).toFixed(1);
                document.getElementById('averageRating').textContent = avgRating;
                
                // Display first page
                displayStudents();
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('testimonials-container').innerHTML = 
                    `<div class="loading">
                        <p>Error loading testimonials.</p>
                        <p style="font-size: 0.9rem; margin-top: 1rem;">Please check:</p>
                        <p style="font-size: 0.85rem;">1. Supabase buckets are public</p>
                        <p style="font-size: 0.85rem;">2. Files are uploaded correctly</p>
                        <p style="font-size: 0.85rem;">3. Check browser console for details</p>
                    </div>`;
            }
        }

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Show random 10 profiles
        function showRandomProfiles() {
            isRandomMode = true;
            const shuffled = shuffleArray(studentsData);
            const randomStudents = shuffled.slice(0, 10);
            
            displayStudentsArray(randomStudents);
            
            // Hide pagination in random mode
            document.getElementById('pagination').style.display = 'none';
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Remove AIK prefix for display only
        function cleanRollNumber(rollNumber) {
            return rollNumber.replace(/^AIK/, '');
        }

        // Create star rating HTML
        function createStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="star ${i <= rating ? '' : 'empty'}">★</span>`;
            }
            return stars;
        }

        // Display students array (for random mode)
        function displayStudentsArray(students) {
            const container = document.getElementById('testimonials-container');
            
            if (students.length === 0) {
                container.innerHTML = '<div class="loading"><p>No testimonials found.</p></div>';
                return;
            }

            container.innerHTML = students.map((student, index) => `
                <div class="testimonial-card" style="animation-delay: ${index * 0.05}s;">
                    <div class="student-header">
                        <img src="${student.image}" alt="${student.name}" class="student-image" 
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%231a2249%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2300d9ff%22 font-size=%2240%22>${student.name.charAt(0)}</svg>'">
                        <div class="student-info">
                            <div class="student-name">${student.name}</div>
                            <div class="student-details">${cleanRollNumber(student.roll_number)}</div>
                            <div class="student-branch">${student.branch}</div>
                        </div>
                    </div>
                    <div class="rating">
                        ${createStars(student.rating)}
                    </div>
                    <div class="review-text">
                        ${student.review}
                    </div>
                </div>
            `).join('');
        }

        // Display students for current page
        function displayStudents() {
            isRandomMode = false;
            const startIndex = (currentPage - 1) * studentsPerPage;
            const endIndex = startIndex + studentsPerPage;
            const studentsToShow = studentsData.slice(startIndex, endIndex);

            displayStudentsArray(studentsToShow);
            updatePagination();
            
            // Show pagination in normal mode
            document.getElementById('pagination').style.display = 'flex';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Update pagination controls
        function updatePagination() {
            const totalPages = Math.ceil(studentsData.length / studentsPerPage);
            const pagination = document.getElementById('pagination');

            let paginationHTML = `
                <button class="pagination-btn" onclick="changePage(${currentPage - 1})" 
                        ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
                
                <div class="page-numbers">
            `;

            // Show page numbers with ellipsis for large page counts
            const maxVisiblePages = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationHTML += `<div class="page-number" onclick="changePage(1)">1</div>`;
                if (startPage > 2) {
                    paginationHTML += `<div class="page-info">...</div>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <div class="page-number ${i === currentPage ? 'active' : ''}" 
                         onclick="changePage(${i})">
                        ${i}
                    </div>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<div class="page-info">...</div>`;
                }
                paginationHTML += `<div class="page-number" onclick="changePage(${totalPages})">${totalPages}</div>`;
            }

            paginationHTML += `
                </div>
                
                <div class="page-info">
                    Page ${currentPage} of ${totalPages}
                </div>
                
                <button class="pagination-btn" onclick="changePage(${currentPage + 1})" 
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;

            pagination.innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(studentsData.length / studentsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            displayStudents();
        }

        // Initialize
        loadStudents();
    </script>
</body>
</html>
