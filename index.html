<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Testimonials - AI Karyashala Bootcamp</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-color: #10b981;
            --bg-light: #fafbfc;
            --bg-white: #ffffff;
            --text-dark: #1a202c;
            --text-medium: #4a5568;
            --text-light: #718096;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.15);
            --star-gold: #f59e0b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Banner */
        .hero-banner {
            background: var(--primary-gradient);
            color: white;
            padding: 5rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 0.6rem 1.5rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .hero-title {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            margin-bottom: 1.25rem;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .hero-description {
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            opacity: 0.95;
            max-width: 750px;
            margin: 0 auto 3rem;
            font-weight: 400;
            line-height: 1.7;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            padding: 2rem 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            display: block;
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.95rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        /* Container */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
        }

        .section-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
        }

        /* Control Bar */
        .control-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .shuffle-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.1rem 2.5rem;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.35s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            font-family: 'Poppins', sans-serif;
        }

        .shuffle-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.45);
        }

        .shuffle-btn:active {
            transform: translateY(-1px);
        }

        .shuffle-icon {
            font-size: 1.4rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .shuffle-btn:hover .shuffle-icon {
            transform: rotate(180deg);
        }

        /* Testimonials Grid */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2.5rem;
            margin-bottom: 4rem;
        }

        /* Testimonial Card */
        .testimonial-card {
            background: var(--bg-white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .testimonial-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow-lg);
            border-color: #667eea;
        }

        /* Review Section */
        .review-section {
            padding: 2.5rem;
            background: linear-gradient(135deg, #fafbfc 0%, #ffffff 100%);
            position: relative;
            flex: 1;
        }

        .quote-mark {
            width: 50px;
            height: 50px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.25);
        }

        .quote-mark svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .review-content {
            font-size: 1.08rem;
            line-height: 1.75;
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 1.5rem;
            min-height: 120px;
        }

        /* Star Rating */
        .star-rating {
            display: flex;
            gap: 0.3rem;
        }

        .star {
            font-size: 1.4rem;
            color: var(--star-gold);
            text-shadow: 0 2px 4px rgba(245, 158, 11, 0.2);
        }

        .star.empty {
            color: #d1d5db;
            text-shadow: none;
        }

        /* Student Info Section */
        .student-info-section {
            padding: 2rem 2.5rem;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .student-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-light);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .student-details {
            flex: 1;
            min-width: 0;
        }

        .student-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.3rem;
        }

        .student-roll {
            font-size: 0.9rem;
            color: var(--text-medium);
            font-weight: 500;
            margin-bottom: 0.6rem;
        }

        .student-badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            background: linear-gradient(135deg, #f0f4ff, #e0e7ff);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            margin: 4rem 0 2rem;
            flex-wrap: wrap;
        }

        .pagination-btn {
            background: white;
            border: 2px solid var(--border-color);
            color: var(--text-dark);
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
            font-family: 'Poppins', sans-serif;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-numbers-container {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .page-num {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .page-num:hover {
            background: var(--bg-light);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .page-num.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
        }

        .page-indicator {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 500;
            padding: 0 1rem;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 6rem 2rem;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-color);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-message {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 24px;
            max-width: 650px;
            margin: 3rem auto;
            box-shadow: var(--shadow-md);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .error-heading {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 1rem;
        }

        .error-text {
            color: var(--text-medium);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .error-info {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-light);
            text-align: left;
            border-left: 4px solid #ef4444;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-banner {
                padding: 4rem 1.5rem 3rem;
            }

            .hero-title {
                font-size: 2.25rem;
            }

            .hero-description {
                font-size: 1.05rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .stat-value {
                font-size: 2.5rem;
            }

            .main-container {
                padding: 3rem 1rem;
            }

            .testimonials-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .review-section {
                padding: 2rem;
            }

            .review-content {
                font-size: 1rem;
                min-height: auto;
            }

            .shuffle-btn {
                padding: 1rem 2rem;
                font-size: 1rem;
            }

            .section-header {
                margin-bottom: 2.5rem;
            }

            .section-title {
                font-size: 1.75rem;
            }
        }

        @media (max-width: 480px) {
            .stat-value {
                font-size: 2rem;
            }

            .stat-label {
                font-size: 0.85rem;
            }

            .student-avatar {
                width: 60px;
                height: 60px;
            }

            .student-name {
                font-size: 1rem;
            }

            .student-roll {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Banner -->
    <div class="hero-banner">
        <div class="hero-content">
            <div class="badge">
                <span>⭐</span>
                <span>Authentic Student Reviews</span>
            </div>
            <h1 class="hero-title">What Our Students Say</h1>
            <p class="hero-description">
                Discover how AI Karyashala Bootcamp has transformed the careers and lives of hundreds of students across India
            </p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="totalStudents">0</span>
                    <span class="stat-label">Total Reviews</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="averageRating">0.0</span>
                    <span class="stat-label">Average Rating</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Section Header -->
        <div class="section-header">
            <h2 class="section-title">Student Testimonials</h2>
            <p class="section-subtitle">Real experiences from real students</p>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <button class="shuffle-btn" onclick="showRandomProfiles()">
                <span class="shuffle-icon">🎲</span>
                <span>Show 10 Random Reviews</span>
            </button>
        </div>

        <!-- Testimonials Grid -->
        <div id="testimonials-container" class="testimonials-grid">
            <div class="loading-state">
                <div class="loader"></div>
                <p class="loading-message">Loading testimonials...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" id="pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://pwghpxxfejmxvwhdjkda.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3Z2hweHhmZWpteHZ3aGRqa2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTE2ODUsImV4cCI6MjA4NjM2NzY4NX0.eU-k1WuDN01cHZ4wibMwNhJkPz6JfrfqJqbed7yPKEY';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let studentsData = [];
        let currentPage = 1;
        const studentsPerPage = 10;
        let isRandomMode = false;

        // Load students data
        async function loadStudents() {
            try {
                console.log('Loading students from Supabase...');

                const { data: urlData } = supabaseClient.storage
                    .from('data')
                    .getPublicUrl('students_data.json');

                const response = await fetch(urlData.publicUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                studentsData = await response.json();

                console.log(`✓ Loaded ${studentsData.length} students successfully!`);

                // Update image URLs
                studentsData = studentsData.map(student => {
                    const imagePath = (student.image || '').replace('student_images/', '');
                    const { data: imageUrlData } = supabaseClient.storage
                        .from('student-images')
                        .getPublicUrl(imagePath);

                    return {
                        ...student,
                        image: imageUrlData.publicUrl
                    };
                });

                // Update stats
                document.getElementById('totalStudents').textContent = studentsData.length;

                const safeLen = studentsData.length || 1;
                const avgRating = (studentsData.reduce((sum, s) => sum + (Number(s.rating) || 0), 0) / safeLen).toFixed(1);
                document.getElementById('averageRating').textContent = avgRating;

                displayStudents();
            } catch (error) {
                console.error('❌ Error loading students:', error);
                document.getElementById('testimonials-container').innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">⚠️</div>
                        <h2 class="error-heading">Unable to Load Testimonials</h2>
                        <p class="error-text">We're experiencing technical difficulties. Please refresh the page or try again later.</p>
                        <div class="error-info">
                            <strong>Error Details:</strong><br>
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Shuffle array
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Show random profiles
        function showRandomProfiles() {
            if (studentsData.length === 0) {
                alert('Please wait for data to load first!');
                return;
            }

            isRandomMode = true;
            const shuffled = shuffleArray(studentsData);
            const randomStudents = shuffled.slice(0, 10);

            displayStudentsArray(randomStudents);
            document.getElementById('pagination').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Clean roll number
        function cleanRollNumber(rollNumber) {
            return String(rollNumber || '').replace(/^AIK/, '');
        }

        // Create stars HTML
        function createStars(rating) {
            const r = Number(rating) || 0;
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="star ${i <= r ? '' : 'empty'}">★</span>`;
            }
            return stars;
        }

        // Display students array
        function displayStudentsArray(students) {
            const container = document.getElementById('testimonials-container');

            if (!students || students.length === 0) {
                container.innerHTML = '<div class="loading-state"><p class="loading-message">No testimonials found.</p></div>';
                return;
            }

            container.innerHTML = students.map((student, index) => `
                <div class="testimonial-card">
                    <div class="review-section">
                        <div class="quote-mark">
                            <svg viewBox="0 0 24 24">
                                <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="review-content">${student.review || ''}</div>
                        <div class="star-rating">
                            ${createStars(student.rating)}
                        </div>
                    </div>
                    <div class="student-info-section">
                        <img src="${student.image}" 
                             alt="${student.name}" 
                             class="student-avatar"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23f0f4ff%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23667eea%22 font-size=%2240%22 font-weight=%22700%22>${String(student.name || 'S').charAt(0)}</text></svg>'">
                        <div class="student-details">
                            <div class="student-name">${student.name || ''}</div>
                            <div class="student-roll">${cleanRollNumber(student.roll_number || '')}</div>
                            <span class="student-badge">${student.branch || ''}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Display students for current page
        function displayStudents() {
            isRandomMode = false;
            const startIndex = (currentPage - 1) * studentsPerPage;
            const endIndex = startIndex + studentsPerPage;
            const studentsToShow = studentsData.slice(startIndex, endIndex);

            displayStudentsArray(studentsToShow);
            updatePagination();
            document.getElementById('pagination').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Update pagination
        function updatePagination() {
            const totalPages = Math.ceil(studentsData.length / studentsPerPage);
            const pagination = document.getElementById('pagination');

            let paginationHTML = `
                <button class="pagination-btn" onclick="changePage(${currentPage - 1})"
                        ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
                <div class="page-numbers-container">
            `;

            const maxVisiblePages = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationHTML += `<div class="page-num" onclick="changePage(1)">1</div>`;
                if (startPage > 2) {
                    paginationHTML += `<div class="page-indicator">...</div>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <div class="page-num ${i === currentPage ? 'active' : ''}"
                         onclick="changePage(${i})">
                        ${i}
                    </div>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<div class="page-indicator">...</div>`;
                }
                paginationHTML += `<div class="page-num" onclick="changePage(${totalPages})">${totalPages}</div>`;
            }

            paginationHTML += `
                </div>
                <div class="page-indicator">
                    Page ${currentPage} of ${totalPages || 1}
                </div>
                <button class="pagination-btn" onclick="changePage(${currentPage + 1})"
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;

            pagination.innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(studentsData.length / studentsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            displayStudents();
        }

        // Initialize
        loadStudents();
    </script>
</body>
</html>
